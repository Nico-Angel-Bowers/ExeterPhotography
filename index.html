<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exeter Photography | Collective Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
        }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-color);
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        h1, h2, h3, h4, .serif {
            font-family: 'Bodoni Moda', serif;
            font-optical-sizing: auto;
        }
        h1, h2, h3, h4 {
            text-wrap: balance;
        }
        
        /* Subtle Film Grain Effect */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Orbit rings: independent per-instance duration/direction via inline style.
           translate(-50%,-50%) is baked into every frame because a CSS animation's
           transform replaces the element's inline transform rather than composing with it. */
        @keyframes orbit-cw-centered {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        @keyframes orbit-ccw-centered {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(-360deg); }
        }

        /* Sophisticated reveal animations */
        @keyframes reveal {
            from { opacity: 0; transform: translateY(50px); filter: blur(4px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        .reveal {
            animation: reveal 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Weaker/older hardware (and anyone who's asked for less motion) gets the rings frozen
           in place rather than fighting the GPU to animate several large layers at once. */
        @media (prefers-reduced-motion: reduce) {
            .reveal, .orbit-ring {
                animation: none !important;
            }
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #fcfcfc;
        }
        ::-webkit-scrollbar-thumb {
            background: #000000;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #333333;
        }
    </style>
</head>
<body class="selection:bg-black selection:text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
